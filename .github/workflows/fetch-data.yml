name: Fetch Star Wars Unlimited data daily

on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (sharp needed for image variant generation)
        run: npm ci

      # Sync with remote in case a push raced this run (matches optcg's
      # update-data.yml â€” avoids merge conflicts on commit).
      - name: Sync with remote
        run: |
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}

      - name: Fetch latest card data (TCGCSV â€” full Fantasy Flight Games catalog + prices)
        run: node scripts/fetch-data.js

      # tcgtopdecks-hq.com Cloudflare returns 403 to data-center IPs, so
      # cloudscraper can't reach it from a GH runner. We fetch the raw
      # HTML with real Chrome via nodriver + nodriver-cf-verify, then
      # the JS parser reads the saved files.
      - name: Setup Python (for tcgtopdecks fetcher)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install Python deps (nodriver + nodriver-cf-verify)
        run: |
          pip install nodriver
          # nodriver-cf-verify isn't on PyPI â€” pull from KlozetLabs fork.
          pip install git+https://github.com/KlozetLabs/nodriver-cf-bypass.git@main#egg=nodriver-cf-verify || true
          if ! python -c "from nodriver_cf_verify import CFVerify" 2>/dev/null; then
            git clone --depth 1 https://github.com/KlozetLabs/nodriver-cf-bypass.git _cfbypass
            cp -r _cfbypass/nodriver_cf_verify ./scripts/scrape-tcgtopdecks/
          fi

      - name: Fetch tcgtopdecks HTML (Xvfb-wrapped real Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
          PYTHONUNBUFFERED: '1'
        timeout-minutes: 10
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            python -u scripts/scrape-tcgtopdecks/fetch_pages.py

      - name: Parse decklists (TablePress â†’ JSON)
        run: node scripts/fetch-decklists.js

      - name: Download any new card images (TCGPlayer CDN, jpgâ†’webp via sharp)
        run: node scripts/download-images.js

      - name: Generate responsive image variants (160w / 640w)
        run: node scripts/process-card-images.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ public/cards/

          if git diff --staged --quiet; then
            echo "No data, decklist, or image changes; nothing to commit."
            exit 0
          fi

          DATE=$(date -u +'%Y-%m-%d')
          git commit -m "data: refresh Star Wars Unlimited cards / decklists / images ($DATE)"
          git push
