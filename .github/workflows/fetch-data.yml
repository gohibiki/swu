name: Fetch Star Wars Unlimited data daily

on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (sharp needed for image variant generation)
        run: npm ci

      # Sync with remote in case a push raced this run.
      - name: Sync with remote
        run: |
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}

      - name: Fetch latest card data (TCGCSV full Fantasy Flight Games catalog + prices)
        run: node scripts/fetch-data.js

      - name: Download any new card images (TCGPlayer CDN, jpg to webp via sharp)
        run: node scripts/download-images.js

      - name: Generate responsive image variants (160w / 640w)
        run: node scripts/process-card-images.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ public/cards/

          if git diff --staged --quiet; then
            echo "No data or image changes; nothing to commit."
            exit 0
          fi

          DATE=$(date -u +'%Y-%m-%d')
          git commit -m "data: refresh Star Wars Unlimited cards and images ($DATE)"
          git push
